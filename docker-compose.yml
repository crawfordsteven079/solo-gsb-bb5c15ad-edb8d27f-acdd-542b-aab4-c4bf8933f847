services:
  db:
    image: postgres:16-alpine
    container_name: strata-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strata}
      POSTGRES_DB: ${POSTGRES_DB:-strata}
    ports:
      # 宿主机可改端口避免冲突：HOST_DB_PORT=5433 docker compose up
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - strata-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strata} -d ${POSTGRES_DB:-strata}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: strata-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-strata}:${POSTGRES_PASSWORD:-strata}@db:5432/${POSTGRES_DB:-strata}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HOST_API_PORT:-8000}:8000"

volumes:
  strata-pgdata:
